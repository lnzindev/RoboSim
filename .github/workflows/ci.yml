name: CI
concurrency:
  group: robosim-fll-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python scripts/test_python_shim.py
      - run: npm install
      - run: node scripts/test_pyodide_runtime.mjs
      - name: Report dependency advisories
        run: |
          npm audit --json > audit.json || true
          node -e "const a=require('./audit.json'); for (const [name,v] of Object.entries(a.vulnerabilities || {})) console.log(name, v.severity, 'direct='+v.isDirect, 'range='+v.range, 'fix='+JSON.stringify(v.fixAvailable))"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
